<style>
/* 業務アプリ：上にヘッダーとタブ、下にカード。ワインの深い赤を差し色、明朝は見出しだけ */
:root{
  --bg:#f3f3f1; --card:#ffffff; --ink:#1f1b1d; --sub:#6b6467; --line:#e2dfe0; --muted:#ecebea;
  --wine:#6e1830; --wineSoft:#f4e4e8; --onWine:#ffffff;
  --ok:#2f6b34; --okSoft:#e3f0e2; --warn:#965f00; --warnSoft:#fbefd6; --bad:#a3262a; --badSoft:#f9e1e1;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161314; --card:#211c1e; --ink:#f0eaec; --sub:#a89fa3; --line:#3a3235; --muted:#2c2528;
  --wine:#e27c95; --wineSoft:#44232d; --onWine:#1b1416;
  --ok:#8cc98a; --okSoft:#203322; --warn:#e6b35a; --warnSoft:#3b2f1c; --bad:#f08a8a; --badSoft:#45201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161314; --card:#211c1e; --ink:#f0eaec; --sub:#a89fa3; --line:#3a3235; --muted:#2c2528;
  --wine:#e27c95; --wineSoft:#44232d; --onWine:#1b1416;
  --ok:#8cc98a; --okSoft:#203322; --warn:#e6b35a; --warnSoft:#3b2f1c; --bad:#f08a8a; --badSoft:#45201f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.65 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:19px}
h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--wine);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub);min-width:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--sub)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--wine);color:var(--onWine);white-space:nowrap}
.btn.ghost{background:var(--muted);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.okb{background:var(--ok);color:var(--card)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.p-new{background:var(--warnSoft);color:var(--warn)}
.p-ok{background:var(--okSoft);color:var(--ok)}
.p-wine{background:var(--wineSoft);color:var(--wine)}
.p-mute{background:var(--muted);color:var(--sub)}
.p-bad{background:var(--badSoft);color:var(--bad)}
.ex{font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:4px;padding:0 5px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.top .wrap{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 11px;font-weight:700;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--wine);border-bottom-color:var(--wine)}
.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--wine);color:var(--onWine);font-size:11px;line-height:18px;text-align:center}
.demo{background:var(--warnSoft);color:var(--warn);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:500;margin-top:12px}
main{padding-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* orders */
.ord{border-left:4px solid var(--line)}
.ord.s-new{border-left-color:var(--warn)} .ord.s-mailed,.ord.s-arrived{border-left-color:var(--wine)} .ord.s-delivered{border-left-color:var(--ok)} .ord.s-cancel{opacity:.55}
.ord h3{font-family:var(--body);font-size:16px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td,.lines th{padding:5px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
.lines th{font-size:11.5px;color:var(--sub);font-weight:500}
.lines td.r,.lines th.r{text-align:right}
.lines tr.imp td{font-size:12px;color:var(--wine);font-weight:700;border-bottom:0;padding-top:8px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--muted);color:var(--sub)}
.ck.done{background:var(--okSoft);color:var(--ok)}
.tbl{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;font-size:14px}
table.list th,table.list td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list th{font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap}
table.list td.r,table.list th.r{text-align:right}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.step input{width:52px;text-align:center;padding:6px 4px}
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:left .15s}
.toggle.on{background:var(--ok)} .toggle.on::after{left:21px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,12,15,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
.modal{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.modal{border-radius:16px;padding:20px 22px}}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .mh h2{flex:1}
.x{border:0;background:var(--muted);border-radius:50%;width:32px;height:32px;font-size:18px}
.paper{background:#fff;color:#222;border-radius:6px;padding:18px;overflow-x:auto;border:1px solid var(--line)}
.paper>div{min-width:560px}
.mailbox{background:var(--muted);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.empty{background:var(--muted);border-radius:10px;padding:22px;text-align:center;color:var(--sub)}
.qr{background:#fff;padding:10px;border-radius:8px;display:inline-block;line-height:0}
.url{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--muted);border-radius:6px;padding:6px 8px}
/* shop (customer) */
.shop-h{padding-top:18px;padding-bottom:8px}
.shop-h .k{font-size:12px;letter-spacing:.2em;color:var(--wine);font-weight:700}
.shop-h h1{font-size:26px;margin-top:2px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;text-align:left;font-weight:700}
.pick button.on{border-color:var(--wine);background:var(--wineSoft);color:var(--wine)}
.itabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;scrollbar-width:none}
.itabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;white-space:nowrap}
.itabs button.on{background:var(--wine);color:var(--onWine);border-color:var(--wine)}
.wine{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.wine:last-child{border-bottom:0}
.wine.has-img{grid-template-columns:auto 1fr auto}
@media (max-width:540px){.wine.has-img{grid-template-columns:auto 1fr;align-items:start}.wine.has-img .bt{grid-row:span 2}.wine.has-img .step{grid-column:2;justify-self:end}}
.wine .bt{width:46px;height:120px;object-fit:contain;background:#fff;border-radius:6px}
.pthumb{width:26px;height:56px;object-fit:contain;background:#fff;border-radius:4px;vertical-align:middle}
.wine .nm{font-weight:700;line-height:1.45}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1px solid var(--line)}
.c-r{background:#8b1e33}.c-w{background:#e9dc9c}.c-p{background:#e7a3b0}.c-o{background:#d99a4a}
.wine .pr{font-size:13px;color:var(--sub)}
.wine .pr b{color:var(--ink);font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.meter{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--wine);transition:width .2s}
.login{max-width:380px;margin:12vh auto 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<div id="ovl"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =========================================================
   農と発酵 Zen 注文・請求アプリ
   - CONFIG.API_URL が空なら「お試し版」（データはこの端末だけ・メールは送られない）
   - 本番は Google Apps Script のURLを入れる
   ========================================================= */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbzRgwQI151r-Bnv-LYq_Ld9olYkKj74X-X8wzz4hBJSQONVQ9rPH4-2ZljGYP5sy8dK/exec' };   // ← GASの「ウェブアプリのURL」をここに貼る（空のままだとお試し版になります）
const DEMO = !CONFIG.API_URL;
const STORE_KEY = 'zen-order-demo-v5';
const APP_VER = '11/1 15:00版'; // 画面のどの版を見ているか（問い合わせのときに確認する）
const DEMO_URL = 'https://claude.ai/artifact/JAmUSeqLVdFX4ZUakS2V9t'; // お試し版の住所（QRコードで開く先）

let DB = null, ME = null, TOKEN = null, TAB = 'orders', CUR_EVENT = null, CUR_YM = null, ORDER_FILTER = 'all', LAST_SYNC = '', POLL = null;
let SHOP = null; // お客さん画面の状態

/* ---------- 小道具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Math.round(+n || 0).toLocaleString('ja-JP');
const comma = n => Math.round(+n || 0).toLocaleString('ja-JP');
const uid = p => (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ds(new Date());
const nowStr = () => { const d = new Date(); return `${ds(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const jd = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return `${m}月${d}日`; };
const jdy = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return `${y}年${m}月${d}日`; };
const hm = s => s ? s.slice(11, 16) : '';
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
// Excelを読む部品は、使うときだけ読み込む（お客さんの注文画面を軽くするため）
function loadXLSX() { if (typeof XLSX !== 'undefined') return Promise.resolve(); if (window._xlsxP) return window._xlsxP; window._xlsxP = new Promise((ok, ng) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = () => ok(); sc.onerror = () => { window._xlsxP = null; ng(new Error('Excelを読む部品が読み込めませんでした（電波を確認して、もう一度ファイルを選んでください）')); }; document.head.appendChild(sc); }); return window._xlsxP; }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (_) {} }
function ssDel(k) { try { sessionStorage.removeItem(k); } catch (_) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (_) {} }

const S = () => DB.settings;
const prod = id => DB.products.find(p => p.id === id);
const imp = id => DB.importers.find(i => i.id === id);
const cust = id => DB.customers.find(c => c.id === id);
const evt = id => DB.events.find(e => e.id === id);
const safeImg = v => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v || '') ? v : '';
const safeUrl = v => /^https?:\/\/[^\s"'<>]+$/.test(v || '') ? v : '';
const pname = p => [p.name, p.vintage, p.maker].filter(Boolean).join(' ');
const normKana = s => String(s ?? '').normalize('NFKC').replace(/([\u30A0-\u30FF])-/g, '$1ー').replace(/\s+/g, ' ').trim();

/* ---------- 計算（税・掛け率・締め日） ---------- */
// 税：groups は「納品（レシート）ごとの明細」の配列。delivery=納品ごとに端数切捨て、invoice=請求書でまとめて切捨て
const tf = x => Math.sign(x) * Math.floor(Math.abs(x) + 1e-9); // 消費税の1円未満切り捨て（返品のマイナスも0の方へ）
function taxCalc(groups, mode) {
  let ex8 = 0, ex10 = 0, tax8 = 0, tax10 = 0;
  groups.forEach(lines => {
    let a8 = 0, a10 = 0;
    lines.forEach(l => { const amt = (+l.price || 0) * (+l.qty || 0); if (+l.tax === 8) a8 += amt; else a10 += amt; });
    ex8 += a8; ex10 += a10;
    if (mode !== 'invoice') { tax8 += tf(a8 * 8 / 100); tax10 += tf(a10 * 10 / 100); }
  });
  if (mode === 'invoice') { tax8 = tf(ex8 * 8 / 100); tax10 = tf(ex10 * 10 / 100); }
  return { ex8, ex10, tax8, tax10, total: ex8 + ex10 + tax8 + tax10 };
}
// 注文の1行が指す商品。試飲会に出していない「追加の商品」は、行の中に名前・上代などを持つ（custom）
function lineProd(l) {
  if (l.custom) { const c = l.custom; return { id: l.productId, importerId: c.importerId || '', name: c.name || '', list: +c.list || 0, kake: c.kake !== false, fixed: +c.fixed || 0, tax: +c.tax || 10, custom: true }; }
  return prod(l.productId);
}
// サービス（無料）の本数：行ごとに手で入れた数が優先。なければ設定の「同じ商品を○本で△本無料」
function freeQty(l, qty) {
  if (l.free != null && l.free !== '') return Math.max(0, Math.min(qty, parseInt(l.free, 10) || 0));
  const d = S().caseDeal; if (!d || !d.on || !(+d.every > 0)) return 0;
  return Math.min(qty, Math.floor(qty / +d.every) * (+d.free || 0));
}
// 掛け率：本数の合計で決める（インポーターをまたいで合算。追加の商品・サービスの本数も入る）
function priceLines(lines) {
  const r = S().rate;
  const items = lines.map(l => ({ l, p: lineProd(l) })).filter(x => x.p && +x.l.qty > 0);
  const kakeCount = items.filter(x => x.p.kake !== false).reduce((a, x) => a + +x.l.qty, 0);
  const rate = kakeCount >= +r.threshold ? +r.over : +r.under;
  const rows = [];
  items.forEach(({ l, p }) => {
    const q = +l.qty, f = freeQty(l, q);
    const base = { productId: p.id, importerId: p.importerId, name: pname(p), list: +p.list || 0, tax: +p.tax || 10, extra: !!p.custom };
    const price = p.kake === false ? (+p.fixed || +p.list || 0) : Math.floor((+p.list || 0) * rate / 100);
    if (q - f > 0) rows.push({ ...base, qty: q - f, price });
    if (f > 0) rows.push({ ...base, name: base.name + '（サービス）', qty: f, price: 0, free: true });
  });
  const count = items.reduce((a, x) => a + +x.l.qty, 0);
  return { rows, rate, count, kakeCount, ...taxCalc([rows], 'delivery') };
}
// インポーターごとにまとめる（イベントに出していないインポーター・「その他」も最後に出す）
function groupRows(rows, importerIds) {
  const ids = [...importerIds, ...[...new Set(rows.map(x => x.importerId))].filter(x => !importerIds.includes(x))];
  return ids.map(iid => ({ i: imp(iid) || { id: '', name: 'その他（追加の商品）' }, rows: rows.filter(x => (x.importerId || '') === (iid || '')) })).filter(g => g.rows.length);
}
function orderPriced(o) {
  if (o.priced && o.priced.rows) return { ...o.priced, ...taxCalc([o.priced.rows], 'delivery') };
  return priceLines(o.lines);
}
const lastDay = (y, m) => new Date(y, m, 0).getDate();
function periodRange(ym) {
  const cd = +S().closingDay || 0, [y, m] = ym.split('-').map(Number);
  if (!cd) return { from: `${ym}-01`, to: `${ym}-${pad(lastDay(y, m))}` };

  if (!DEMO) {
    const key = col + ':' + item.id, base = CONFLICT_BASE[key];
    if (base) { // 2回目：最新の内容に、自分が変えた所だけを重ねる
      const latest = col === 'settings' ? DB.settings : (DB[col] || []).find(x => x.id === item.id);
      if (latest) { const merged = { ...latest }; Object.keys(item).forEach(k => { if (k !== '_rev' && JSON.stringify(item[k]) !== JSON.stringify(base[k])) merged[k] = item[k]; }); merged._rev = latest._rev; item = merged; }

    catch (e) {
      if (e.message !== 'CONFLICT') throw e;
      CONFLICT_BASE[key] = col === 'settings' ? DB.settings : (DB[col] || []).find(x => x.id === item.id) || {};
      try { await reloadStrict(); } catch (_) {} // 画面は描き直さない（入力を消さないため）

/* ---------- モーダル・確認 ---------- */
function openModal(title, html, onMount) {

}
function closeModal() { $('#ovl').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; const tops = document.querySelectorAll('body > .ov'); if (tops.length) tops[tops.length - 1].remove(); else if ($('#ovl') && $('#ovl').innerHTML) closeModal(); });
function confirmBox(msg, okLabel, fn) {
  const o = document.createElement('div'); o.className = 'ov'; o.style.zIndex = 9999;
  o.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" style="max-width:460px"><div class="mh"><h2>確認</h2></div><p style="white-space:pre-wrap;margin:0 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-cb="no">やめる</button><button class="btn" data-cb="ok">${esc(okLabel)}</button></div></div>`;

}
// 送信前に必ず内容を見せる（宛先・件名・本文は直せる）
function mailPreview(opt) {
  // opt: {title, to, subject, body, attach?, after(to), afterSent(to), onSkip(), extra(), require(), before()}
  const noTo = !opt.to; const sendId = opt.sendId || uid('s'); // 同じ送信IDは、サーバーの送信記録（_maillog）で1回しか送られない
  openModal(opt.title || 'メールの確認', `
    <div class="stack">
      ${DEMO ? '<div class="demo" style="margin:0">お試し版なので、実際にはメールは送られません。送られる内容を確認できます。</div>' : ''}
      <label class="f" for="mp-to">宛先<input id="mp-to" type="email" value="${esc(opt.to || '')}" placeholder="メールアドレスが登録されていません"></label>
      <label class="f" for="mp-sub">件名<input id="mp-sub" value="${esc(opt.subject)}"></label>
      <label class="f" for="mp-body">本文<textarea id="mp-body" style="min-height:280px">${esc(opt.body)}</textarea></label>
      ${opt.attach ? `<div class="small">📎 添付：${esc(opt.attach)}</div>` : ''}
      ${opt.noMailLabel ? `<div class="small sub">メールを送らずに進める場合は「${esc(opt.noMailLabel)}」を押してください。</div>` : ''}
      <div class="row" style="justify-content:flex-end">
        ${opt.noMailLabel ? `<button class="btn line" id="mp-skip">${esc(opt.noMailLabel)}</button>` : ''}
        <button class="btn" id="mp-send">この内容で送信する</button>
      </div>
    </div>`, () => {
    if (noTo) $('#mp-to').focus();
    if ($('#mp-skip')) $('#mp-skip').onclick = async () => { $('#mp-skip').disabled = true; try { await opt.onSkip(); closeModal(); render(); toast('メールを送らずに進めました'); } catch (e) { toast('うまくいきませんでした：' + e.message); if ($('#mp-skip')) $('#mp-skip').disabled = false; } };
    $('#mp-send').onclick = async () => {
      const to = $('#mp-to').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { toast('宛先のメールアドレスを入れてください'); $('#mp-to').focus(); return; }
      $('#mp-send').disabled = true; $('#mp-send').textContent = '送信中…';
      try {
        if (opt.before) await opt.before();
        await sendMail({ to, subject: $('#mp-sub').value, body: $('#mp-body').value, ...(opt.extra ? opt.extra() : {}) }, opt.after ? opt.after(to) : null, { sendId, require: opt.require ? opt.require() : null });
      } catch (e) {
        if (/すでに送っていました/.test(e.message)) { closeModal(); render(); toast(e.message); return; }
        const known = /CONFLICT|ほかの人|宛先|確認がそろって|内容が変わ|送信中|送信済み/.test(e.message);
        toast(known ? '送信しませんでした：' + e.message : '送れたかどうか確認できませんでした。この画面のまま、もう一度「この内容で送信する」を押してください（送れていた場合は送り直しません）');

      }
      try { if (opt.afterSent) await opt.afterSent(to); } catch (_) {}
      closeModal(); render(); toast(DEMO ? '送信しました（お試し版なので実際には送られていません）' : '送信しました');
    };
  });
}

  }

  SHOP = { clientId: uid('c'), eventId, importer: importerId && e.importerIds.includes(importerId) ? importerId : e.importerIds[0], customerId: '', newName: '', newEmail: '', note: '', cart: {}, step: 'items', q: '', fromStaff: !!fromStaff, no: null };

  return `<div class="small" style="background:var(--warnSoft);color:var(--warn);border-radius:6px;padding:6px 9px">⚠ このお店の注文がほかにもあります（${others.map(x => `No.${x.no}・${orderPriced(x).count}本`).join('、')}）。合わせると${cnt}本です。掛け率は注文ごとに計算しています${pr.count < th && cnt >= th ? `。まとめて${S().rate.over}掛けにする場合は、片方の「内容を直す」で本数をまとめてから、もう片方を「取消」してください` : ''}。</div>`;

// A4で印刷する（印刷の画面で「PDFに保存」を選ぶとPDFになる）
// 埋め込みの画面などで印刷の画面が開けないときは、黙って終わらせず、請求書のファイルを保存する方法を出す
function printDoc(html, filename) {
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(() => {
    let ok = true; const t0 = Date.now();
    try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { ok = false; }
    if (Date.now() - t0 < 400) ok = false; // 印刷の画面が開くと、閉じるまでここで止まる。すぐ戻ってきた＝開けなかった
    setTimeout(() => f.remove(), 1000);
    if (!ok && !printInNewTab(html)) printFallback(html, filename);
  }, 300);
}
// 埋め込みの画面で印刷が止められているとき：請求書だけの新しいタブを開き、そこで Ctrl＋P で印刷してもらう
function printInNewTab(html) {
  let w = null; try { w = window.open('', '_blank'); } catch (_) { w = null; }
  if (!w) return false;
  try {
    const bar = '<div class="noprint" style="position:sticky;top:0;background:#fff8d6;border-bottom:1px solid #e5c55a;padding:12px 16px;font:16px sans-serif;z-index:9">このページを <b>Ctrl＋P</b>（Macは <b>⌘＋P</b>）で印刷してください。印刷の画面で「PDFに保存」を選ぶとPDFになります。<style>@media print{.noprint{display:none}}</style></div>';
    w.document.open(); w.document.write(html.replace('<body>', '<body>' + bar)); w.document.close();
    try { w.focus(); w.print(); } catch (_) {}
    return true;
  } catch (_) { try { w.close(); } catch (__) {} return false; }
}

// ひらがな・半角カナ → 全角カタカナ（店名をカナで探すため）
const kataQ = v => String(v || '').normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60)).replace(/\s+/g, '');

const pk = v => String(v ?? '').normalize('NFKC').trim().replace(/^0+(?=\d)/, '');
const nk = v => String(v ?? '').normalize('NFKC').replace(/\s+/g, ' ').trim(); // 半角カナ → 全角
// ファイルの文字コードを自動で見分けて読む（Shift_JIS／UTF-8／UTF-16。文字化けして保存されたものも直す）
function decodeText(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));

function parseTable(text) {

  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; continue; }
    if (ch === '"' && cur === '') q = true;
    else if (ch === delim) { row.push(cur.trim()); cur = ''; }
    else if (ch === '\n') { row.push(cur.trim()); if (row.some(x => x !== '')) rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur.trim()); if (row.some(x => x !== '')) rows.push(row);
  return rows; // 「"」で囲まれた中の改行やカンマも、1つの欄として読む
}

  m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 864e5); return d.toISOString().slice(0, 10); } // Excelの日付番号
  return '';
}

function shrinkImage(file) {
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(220 / im.height, 200 / im.width, 1) || 1, h = Math.max(1, Math.round(im.height * k)), w = Math.max(1, Math.round(im.width * k)); const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h); ok(c.toDataURL('image/jpeg', 0.72));
    }; im.onerror = ng; im.src = r.result; };
    r.onerror = ng; r.readAsDataURL(file);
  });
}

    if ($('#st-cdon').checked && !(+v('st-cdev') >= 1 && +v('st-cdfr') >= 1 && +v('st-cdfr') < +v('st-cdev'))) { toast('ケース特典は「○本で△本無料」を、△が○より小さい数で入れてください'); return; }
    const ns = { ...s, shop: { name: v('st-name'), regNo: v('st-reg'), zip: v('st-zip'), addr: v('st-addr'), tel: v('st-tel'), fax: v('st-fax'), email: v('st-email') }, bank: v('st-bank'), note: v('st-note'), signature: v('st-sig'),
      rate: { threshold: +v('st-th') || 12, under: +v('st-un') || 75, over: +v('st-ov') || 70 }, billFrom: v('st-bill'), bcposTax: Object.fromEntries(v('st-btax').split(/[,、，\s]+/).map(x => x.replace(/\D/g, '')).filter(Boolean).map(k => [k, 8])), caseDeal: { on: $('#st-cdon').checked, every: Math.max(1, +v('st-cdev') || 12), free: Math.max(1, +v('st-cdfr') || 1) }, closingDay: +v('st-cd'), dueMonths: +v('st-due'), taxMode: v('st-tax'), staff, notifyTo: v('st-notify'),
      mail: { orderSubject: v('mt-os'), orderBody: v('mt-ob'), arrivalSubject: v('mt-as'), arrivalBody: v('mt-ab'), invoiceSubject: v('mt-is'), invoiceBody: v('mt-ib') } };
    await save('settings', ns); render(); toast('保存しました');
  };
  if ($('#st-quota')) api('quota').then(j => { const el = $('#st-quota'); if (el) el.textContent = `今日あと${j.remaining}通メールを送れます`; }).catch(() => {});
  if ($('#st-reset')) $('#st-reset').onclick = () => confirmBox('お試しデータを最初の状態に戻しますか？', '戻す', async () => { DB = seed(); persist(); });
  if ($('#st-out')) $('#st-out').onclick = logout;
  if ($('#st-pw')) $('#st-pw').onclick = () => openModal('パスワードを変える', `<div class="stack"><label class="f" for="pw-old">今のパスワード<input id="pw-old" type="password"></label><label class="f" for="pw-new">新しいパスワード（8文字以上）<input id="pw-new" type="password"></label><button class="btn" id="pw-ok">変更する</button></div>`, () => {
    $('#pw-ok').onclick = async () => { const n = $('#pw-new').value; if (n.length < 8) { toast('8文字以上にしてください'); return; }
      try { const j = await api('changePassword', { oldPassword: $('#pw-old').value, newPassword: n }); TOKEN = j.token; lsSet('zen-token', TOKEN); closeModal(); toast('変更しました。他の人にも新しいパスワードを伝えてください'); } catch (e) { toast(e.message === 'AUTH' ? '今のパスワードが違います' : '変更できませんでした'); } };
  });
}

/* ---------- 起動 ---------- */
(async function boot() {
  const qs = new URLSearchParams(location.search);
  const e = qs.get('e'), i = qs.get('i');
  if (DEMO) {
    let saved = null; try { saved = JSON.parse(lsGet(STORE_KEY) || 'null'); } catch (_) {}
    DB = saved && saved.settings ? saved : seed();
    ME = lsGet('zen-me') || null;
    const hm_ = location.hash.match(/^#order(?:-([A-Za-z0-9_]+))?$/);
    if (hm_ || e) { await startShop(e || DB.events[0].id, (hm_ && hm_[1]) || i, false); return; }
    render(); return;
  }
  if (e) { await startShop(e, i, false); return; }
  TOKEN = lsGet('zen-token'); ME = lsGet('zen-me');
  if (TOKEN) { try { const j = await api('load'); DB = await ensureInit(j.db); LAST_SYNC = nowStr(); } catch (_) { TOKEN = null; } }
  render();
})();
</script>
